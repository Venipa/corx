name: Release Docker Image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release binaries from Docker image build
        shell: bash
        run: |
          mkdir -p dist/amd64-rootfs dist/arm64-rootfs

          docker buildx build \
            --platform linux/amd64 \
            --target builder \
            --output type=local,dest=dist/amd64-rootfs \
            .

          docker buildx build \
            --platform linux/arm64 \
            --target builder \
            --output type=local,dest=dist/arm64-rootfs \
            .

          cp dist/amd64-rootfs/app/corx dist/corx-amd64
          cp dist/arm64-rootfs/app/corx dist/corx-arm64
          tar -cf dist/corx-amd64.tar -C dist corx-amd64
          tar -cf dist/corx-arm64.tar -C dist corx-arm64
          rm -rf dist/amd64-rootfs dist/arm64-rootfs

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          provenance: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "${{ github.ref_name }}"
          draft: true
          body: |
            ${github.repository_owner}/${github.repository} v${{ github.ref_name }}
            - Build binaries from Docker image build
            - amd64: dist/corx-amd64.tar
            - arm64: dist/corx-arm64.tar
            Run the following command to execute the binary:
            ```bash
            bun ./corx-amd64
            ```
          overwrite_files: true
          files: |
            dist/corx-amd64.tar
            dist/corx-arm64.tar
