"$schema" = "./node_modules/wrangler/config-schema.json"
name = "corx"
main = "src/worker.ts"
compatibility_date = "2026-03-30"
workers_dev = true
compatibility_flags = []

[build]
command = "bun build src/worker.ts --outfile corx"

[deploy]
command = "bun corx"

[observability]
[observability.logs]
enabled = true # log errors
invocation_logs = false

[observability.traces]
enabled = true # trace errors and performance